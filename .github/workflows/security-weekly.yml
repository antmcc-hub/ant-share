name: Weekly main security scan
on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-weekly-main
  cancel-in-progress: false
jobs:
  hosted-policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the public repository's hosted fallback
        env:
          CONFIGURED_RUNNER: ${{ vars.CI_RUNNER }}
        run: |
          if [ -n "$CONFIGURED_RUNNER" ]; then
            echo "::error::CI_RUNNER must remain unset for this public repository."
            exit 1
          fi
  gitleaks:
    needs: hosted-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Remove the local redacted finding report
        if: always()
        run: rm -f results.sarif
  osv:
    needs: hosted-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the entire repository; findings and errors fail
        run: python3 .github/scripts/osv_weekly.py
