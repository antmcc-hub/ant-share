name: Weekly main security scan
on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-weekly-main
  cancel-in-progress: false
jobs:
  hosted-policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the public repository's hosted fallback
        env:
          CONFIGURED_RUNNER: ${{ vars.CI_RUNNER }}
        run: |
          if [ -n "$CONFIGURED_RUNNER" ]; then
            echo "::error::CI_RUNNER must remain unset for this public repository."
            exit 1
          fi
  gitleaks:
    needs: hosted-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Remove the local redacted finding report
        if: always()
        run: rm -f results.sarif
  osv:
    needs: hosted-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the entire repository; findings and errors fail
        run: python3 .github/scripts/osv_weekly.py
